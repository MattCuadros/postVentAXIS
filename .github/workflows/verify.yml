name: Verificar

# Corre en cada rama de funcionalidad y en cada Pull Request hacia master: tsc, lint, pruebas
# unitarias, build y pruebas end-to-end. Es el mismo comando que se corre antes de cada merge
# programado (ver merge-programado.yml), así que si esto falla, esa rama nunca se fusiona.
on:
  pull_request:
    branches: [master]
  push:
    branches: ["feat/**", "fix/**", "programado/**"]
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
